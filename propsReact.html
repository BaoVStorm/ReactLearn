    JSX - babel

    React
    ReactDOM
-->

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA_Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReactJS</title>
    
    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>     
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- JSX - Babel -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
   
<body>
    <div id="root"></div>

    <script type="text/babel">
        /*
            ================ bài về Props
                Props có thể truyền bất kỳ dữ liệu nào 
                VD: 1 mảng
                    <div
                        data = {[1,3,4,5,5]}
                        lists = {[{name: 1}, {name: 2}, {name: 3}, {name: 4}, {name: 5}]}     
                    />

                VD: 1 hàm
                    <div
                        callback = {() => {
                            return 1 + 1;
                        }}
                        
                        callback2 = {(a, b) => a + b}
                    />


            App(), PostItem(), <PostItem/> : là ReactComponent
                Thì có thẻ attribute giống như Html
                Khác mỗi class và for -> className và htmlFor (cho label của form)


            <div className="posts-item"> là ReactElement
                đối số như 1 function
        
        */ 

        // --------------- App.js
        function PostItem() {
            return (
                <div className="posts-item">
                    <img src="asdasd" alt="img"/>
                    <h2 className="post-title">asdasd</h2>
                        <p className="post-desc">asdasd</p>
                        <p className="post-published">asdasd</p>
                </div>
            );
                
        }

        function App() {
            return (
                <div className='wrapper'>
                    <PostItem/>    
                    <PostItem/>    
                    <PostItem/>    
                </div>
            );
        }

        // --------------- index.js

        const rootContainer = document.getElementById("root");

        var root = ReactDOM.createRoot(rootContainer);

        root.render(<App/>);

        // ------------------------------------------------------ type2 ---------

        function PostItemWithProps(props) {
            return (
                <div className="posts-item">
                    <img src={props.image} alt="img"/>
                    <h2 className="post-title">{props.title}</h2>
                    <p className="post-desc">{props.description}</p>
                    <p className="post-published">{props.pushishedAt}</p>
                </div>
            );       
        }

        function App2() {
            return (
                <div className='wrapper'>
                    <PostItemWithProps
                        image="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_1DemQdAPhyCuLBMoSNwVteTQMuSUJzuH5g&s"
                        title="title content 1"
                        description="description content 1"
                        pushishedAt = "1 days"
                    />    
                    <PostItemWithProps
                        image="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_1DemQdAPhyCuLBMoSNwVteTQMuSUJzuH5g&s"
                        title="title content 2"
                        description="description content 2"
                        pushishedAt = "2 days"
                    />      
                    <PostItemWithProps
                        image="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_1DemQdAPhyCuLBMoSNwVteTQMuSUJzuH5g&s"
                        title="title content 3"
                        description="description content 3"
                        pushishedAt = "3 days"
                    />  
                </div>
            );
        }


        root.render(<App2/>);

        // ------------------------------------------------------ Array ---------

        const posts = [{
                img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_1DemQdAPhyCuLBMoSNwVteTQMuSUJzuH5g&s',
                title: 'title1',
                desc: 'description1',
                date: '1 day'
            }, {
                img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_1DemQdAPhyCuLBMoSNwVteTQMuSUJzuH5g&s',
                title: 'title2',
                desc: 'description2',
                date: '2 days'
            }, {
                img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_1DemQdAPhyCuLBMoSNwVteTQMuSUJzuH5g&s',
                title: 'title3',
                desc: 'description3',
                date: '3 days'
            }, {
                img: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_1DemQdAPhyCuLBMoSNwVteTQMuSUJzuH5g&s',
                title: 'title3',
                desc: 'description3',
                date: '3 days'
            }
        ];

        function App3() {
            return (
                <div className='wrapper'>
                    {
                        posts.map((post, index) => {
                            return (
                                <PostItemWithProps
                                    key = {index}
                                    image={post.img}
                                    title={post.title}
                                    description={post.desc}
                                    pushishedAt = {post.date}
                                /> 
                            );
                        })
                    }
                </div>
            );
        }

        root.render(<App3/>);

    </script>


</body>
</html>
